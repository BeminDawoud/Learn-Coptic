*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f5efe3}
body{
  font-family:Tahoma,Arial,sans-serif;
  color:#2e2440;
  padding:22px;
  background:
    radial-gradient(circle at 10% 8%,rgba(236,191,88,.22),transparent 26%),
    radial-gradient(circle at 92% 88%,rgba(87,120,161,.18),transparent 27%),
    linear-gradient(135deg,#f7f0df 0%,#f2e8d4 45%,#e9eef2 100%);
}
.sheet{
  max-width:1220px;
  min-height:760px;
  margin:auto;
  position:relative;
  overflow:hidden;
  border-radius:28px;
  background:#fffdf8;
  border:2px solid #c7a75b;
  box-shadow:0 20px 55px rgba(56,42,74,.18);
}
.topband{
  height:18px;
  background:linear-gradient(90deg,#5d416f,#9b6b59,#c49a43,#486c80,#5d416f);
}
.corner{
  position:absolute;
  width:170px;height:170px;
  border:2px solid rgba(176,139,55,.25);
  transform:rotate(45deg);
  border-radius:28px;
}
.c1{left:-105px;top:65px}.c2{right:-105px;bottom:10px}
.content{padding:30px 58px 45px;position:relative;z-index:1}
.title-wrap{text-align:center;margin:0 0 28px}
.cross{
  font-size:42px;
  color:#9c7727;
  line-height:1;
  margin-bottom:8px;
}
h1{
  display:inline-block;
  margin:0;
  font-size:36px;
  color:#49345e;
  padding:9px 32px 14px;
  border-bottom:3px double #c19a42;
}
.ornament{
  margin:9px auto 0;
  width:240px;height:1px;
  background:linear-gradient(90deg,transparent,#9c7727,transparent);
}
.exercise{
  direction:ltr;
  max-width:1000px;
  margin:auto;
}
.row{
  display:grid;
  grid-template-columns:max-content 118px 1fr;
  align-items:center;
  gap:20px;
  min-height:76px;
  padding:9px 22px;
  margin:8px 0;
  border-radius:15px;
  font-family:"CSAvaVeni",serif;
  font-size:39px;
  color:#231b2d;
}
.row:nth-child(odd){background:rgba(112,82,129,.055)}
.row:nth-child(even){background:rgba(192,154,66,.065)}
.answer{
  width:118px;height:55px;
  border:2.5px solid #75588b;
  border-radius:9px;
  background:#fffefa;
  font-family:"CSAvaVeni",serif;
  font-size:35px;
  text-align:center;
  color:#241b2e;
  outline:none;
  box-shadow:inset 0 1px 5px rgba(35,25,45,.08);
  transition:.15s ease;
}
.answer:hover{border-color:#b58c31}
.answer:focus{
  border-color:#b58c31;
  box-shadow:0 0 0 4px rgba(181,140,49,.17);
  background:#fffdf5;
}
.footer-mark{
  text-align:center;
  color:#ad8a3c;
  font-size:22px;
  margin-top:22px;
  letter-spacing:8px;
}
@media(max-width:720px){
  body{padding:8px}
  .sheet{border-radius:18px}
  .content{padding:22px 12px 30px}
  h1{font-size:25px;padding:8px 8px 11px}
  .cross{font-size:34px}
