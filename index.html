<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learn Coptic | تعلم اللغة القبطية</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=1.2">
</head>

<body>

    <!-- ===========================
            HEADER
    ============================ -->

    <header>

        <h1>📖 Learn Coptic</h1>

        <p class="subtitle">
            تعلم اللغة القبطية
        </p>
    </header>

    <!-- ===========================
        SECTIONS BUTTON
    =========================== -->

    <button id="menuButton">

        ☰

    </button>

    <!-- ===========================
        SIDE NAVIGATION
=========================== -->

    <nav id="sideMenu">

        <div class="menu-header">

            <h3>📚 الفهرس</h3>

            <button id="closeMenu">

                ✕

            </button>

        </div>

        <div id="menuItems">

            <!-- JavaScript will create the sections here -->

        </div>

    </nav>

    <div id="menuOverlay"></div>

    <!-- ===========================
            SEARCH BAR
    ============================ -->

    <section class="search-section">

        <input type="text" id="searchBox" placeholder="ابحث عن درس...">

    </section>


    <!-- ===========================
            LESSONS
    ============================ -->

    <main id="lessonContainer">

        <!-- JavaScript will create all lesson cards here -->

    </main>

    <!-- ===========================
            MODAL
    ============================ -->

    <div id="viewer" class="hidden">

        <div class="viewer-content">

            <button id="closeViewer">
                ✕
            </button>

            <h2 id="viewerTitle"></h2>

            <div id="viewerBody"></div>

        </div>

    </div>

    <!-- ===========================
            SCROLL TO TOP
    ============================ -->

    <button id="scrollTopBtn">
        ↑
    </button>

    <!-- ===========================
            FOOTER
    ============================ -->

    <footer>

        <p>
            Learn Coptic © 2026
        </p>
        <p class="developer">

        </p>

    </footer>

    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
